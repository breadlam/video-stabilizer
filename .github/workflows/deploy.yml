name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Type checks, unit tests and the production build gate the deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  # Browser end-to-end tests. They depend on the runner's video codecs (GitHub's Linux machines have
  # no hardware encoders), so they report results without blocking the deploy.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ffmpeg renders the fixture videos; Google Chrome is preinstalled on the runner.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results
          retention-days: 7
