name: Browser tests

# End-to-end tests in Chrome. They depend on the machine's video codecs, and GitHub's Linux runners
# have no hardware encoders, so they run on demand rather than on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ffmpeg renders the fixture videos; Google Chrome is preinstalled on the runner.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results
          retention-days: 7
